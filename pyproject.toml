[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evidencelib"
version = "1.0.1"
description = "Computational belief functions for DST and DSmT."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "evidencelib contributors" }]
keywords = ["dempster-shafer", "dst", "dsmt", "belief-functions", "evidence-theory"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
plot = [
  "matplotlib>=3.7",
]
docs = [
  "myst-parser>=4.0",
  "sphinx>=8.0",
  "sphinx-rtd-theme>=3.0",
]
dev = [
  "build>=1.0",
  "matplotlib>=3.7",
  "myst-parser>=4.0",
  "pytest>=8.0",
  "sphinx>=8.0",
  "sphinx-rtd-theme>=3.0",
]

[project.urls]
Documentation = "https://evidencelib.readthedocs.io/en/latest/"
Source = "https://github.com/itaprac/evidencelib"
Issues = "https://github.com/itaprac/evidencelib/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
