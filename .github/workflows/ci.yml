name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  quality:
    name: Quality and documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=90
      - name: Documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  build:
    name: Build and inspect package
    runs-on: ubuntu-latest
    needs: [tests, quality]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Check package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          excluded = ("tmp/", "dist/", ".clawpatch/", "docs/_build/")
          for archive in Path("dist").iterdir():
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive) as package:
                      names = [
                          name.split("/", 1)[1]
                          for name in package.getnames()
                          if "/" in name
                      ]
              else:
                  continue
              leaked = [
                  name for name in names
                  if any(name == prefix[:-1] or name.startswith(prefix) for prefix in excluded)
              ]
              if leaked:
                  raise SystemExit(f"{archive} contains excluded files: {leaked}")
          PY
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/evidencelib-smoke
          /tmp/evidencelib-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/evidencelib-smoke/bin/python - <<'PY'
          from evidencelib import Frame

          frame = Frame.dst(["A", "B"])
          assert frame.region_count == 2
          PY
